<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register — Pawfect Home</title><link rel="stylesheet" href="/src/styles.css"><script src="/config.js"></script></head><body><a class="skip" href="#main">Skip to content</a><header id="site-header"></header><main id="main" class="auth-shell"><section class="auth-card"><div class="auth-mark">🐾</div><span class="eyebrow">Join the mission</span><h1>Create an account</h1><p>Register as an admin to manage adoptable pets.</p><form id="auth-form"><label>Name<input required name="name" autocomplete="name" placeholder="Your name"></label><label>Email<input required type="email" name="email" autocomplete="email" placeholder="admin@example.com"></label><label>Password<input required minlength="8" type="password" name="password" autocomplete="new-password" placeholder="At least 8 characters"></label><p id="form-error" class="error" role="alert"></p><button class="button full" type="submit">Create account</button></form><p class="auth-switch">Already registered? <a href="/account/login.html">Log in</a></p></section></main><footer id="site-footer"></footer><script type="module" src="/src/auth-page.js"></script></body></html>
